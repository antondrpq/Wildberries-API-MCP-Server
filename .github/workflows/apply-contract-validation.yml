name: Apply API contract validation

on:
  push:
    branches: [agent/mark-legacy-ad-endpoints]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[contract-validation]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Patch server, package metadata, README and tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          server = Path('wb-api-mcp-server.js')
          text = server.read_text(encoding='utf-8-sig')

          require_anchor = "const { parseWorkbookBuffer: parseDailyStatsBuffer } = require('./lib/evirmaDailyStatsParser');"
          require_line = "const apiContractMiddleware = require('./lib/apiContractMiddleware');"
          if require_line not in text:
              if require_anchor not in text:
                  raise SystemExit('Server require anchor not found')
              text = text.replace(require_anchor, require_anchor + "\n" + require_line, 1)

          use_anchor = "app.use(authMiddleware);"
          use_line = "app.use(apiContractMiddleware);"
          if use_line not in text:
              if use_anchor not in text:
                  raise SystemExit('Auth middleware anchor not found')
              text = text.replace(use_anchor, use_anchor + "\n" + use_line, 1)

          server.write_text(text, encoding='utf-8-sig')

          package_path = Path('package.json')
          package_data = json.loads(package_path.read_text(encoding='utf-8'))
          package_data.setdefault('engines', {})['node'] = '>=22'
          package_path.write_text(json.dumps(package_data, ensure_ascii=False, indent=2) + "\n", encoding='utf-8')

          readme = Path('README.md')
          readme_text = readme.read_text(encoding='utf-8')
          readme_text = readme_text.replace('Node.js **20 или выше**', 'Node.js **22 или выше**')
          readme_text = readme_text.replace('Следующие локальные маршруты сохранены для совместимости, но требуют отдельной проверки актуальных методов WB API:', 'Следующие локальные маршруты сохранены для обратной совместимости и помечены как legacy/deprecated; без подтверждённой замены WB они не удаляются:')
          marker = '### 2. Воронка продаж (Sales Funnel)'
          section = '''### Контроль входных контрактов\n\nСервер выполняет локальную валидацию контрактов перед обращением к Wildberries для основных аналитических и статистических методов. Некорректные запросы возвращаются как HTTP `400` без лишнего запроса в WB.\n\nОсновные проверки:\n\n* Sales Funnel: даты, лимиты `nmIds`, `aggregationLevel`, период и комбинации фильтров grouped history;\n* Search Report: обязательные `positionCluster`, `orderBy`, `limit`, `offset`, допустимые `topOrderBy` и ограничения поисковых текстов;\n* Stocks Report: `availabilityFilters`, `limit`, `offset` и идентификаторы товаров;\n* Fullstats: `ids` (1–50 кампаний), `beginDate` и `endDate` с максимумом 31 день.\n\nРеальные ограничения WB могут зависеть от тарифа и текущей версии API; сервер проверяет базовые контрактные ограничения, а окончательное право доступа и тарифные ограничения остаются на стороне WB.\n\n'''
          if '### Контроль входных контрактов' not in readme_text:
              if marker not in readme_text:
                  raise SystemExit('README insertion marker not found')
              readme_text = readme_text.replace(marker, section + marker, 1)
          readme.write_text(readme_text, encoding='utf-8')
          PY

      - name: Add contract integration tests
        run: |
          cat > test/apiContractMiddleware.test.js <<'EOF'
          'use strict';

          process.env.NODE_ENV = 'test';

          const request = require('supertest');
          const axios = require('axios');

          jest.mock('axios', () => jest.fn());

          const app = require('../wb-api-mcp-server');

          describe('WB API contract middleware', () => {
            beforeEach(() => axios.mockReset());

            test('rejects Search Report without required fields before WB call', async () => {
              const res = await request(app)
                .post('/api/search-report/report')
                .set('api-key', 'test')
                .send({ currentPeriod: { start: '2026-08-12', end: '2026-08-18' } });

              expect(res.status).toBe(400);
              expect(res.body.error).toBe(true);
              expect(axios).not.toHaveBeenCalled();
            });

            test('accepts valid Search Report and proxies to WB', async () => {
              axios.mockResolvedValue({ status: 200, statusText: 'OK', data: { ok: true }, headers: {} });

              const res = await request(app)
                .post('/api/search-report/report')
                .set('api-key', 'test')
                .send({
                  currentPeriod: { start: '2026-08-12', end: '2026-08-18' },
                  positionCluster: 'all',
                  orderBy: { field: 'avgPosition', mode: 'desc' },
                  limit: 100,
                  offset: 0,
                  includeSearchTexts: true,
                  includeSubstitutedSKUs: false
                });

              expect(res.status).toBe(200);
              expect(axios).toHaveBeenCalledTimes(1);
            });

            test('rejects invalid stock availability filter before WB call', async () => {
              const res = await request(app)
                .post('/api/stocks-report/products/products')
                .set('api-key', 'test')
                .send({ availabilityFilters: ['not-supported'], limit: 10, offset: 0 });

              expect(res.status).toBe(400);
              expect(axios).not.toHaveBeenCalled();
            });

            test('rejects invalid Fullstats period before WB call', async () => {
              const res = await request(app)
                .get('/api/adv/fullstats')
                .set('api-key', 'test')
                .query({ ids: '1,2', beginDate: '2026-01-01', endDate: '2026-02-15' });

              expect(res.status).toBe(400);
              expect(axios).not.toHaveBeenCalled();
            });

            test('accepts legacy Sales Funnel fields and validates normalized contract', async () => {
              axios.mockResolvedValue({ status: 200, statusText: 'OK', data: { ok: true }, headers: {} });

              const res = await request(app)
                .post('/api/nm-report/detail')
                .set('api-key', 'test')
                .send({
                  nmIDs: [178773045],
                  period: { begin: '2026-08-12', end: '2026-08-18' },
                  page: 1
                });

              expect(res.status).toBe(200);
              expect(axios).toHaveBeenCalledTimes(1);
            });
          });
          EOF

      - name: Test
        run: npm test -- --runInBand
        env:
          NODE_ENV: test

      - name: Lint
        run: npm run lint

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wb-api-mcp-server.js package.json README.md test/apiContractMiddleware.test.js
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m 'Add API contract validation [contract-validation]'
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/apply-contract-validation.yml
          git commit -m 'Remove one-time contract validation workflow [contract-validation]'
          git push origin HEAD:${GITHUB_REF_NAME}
