services:
  wb-api-mcp:
    build: .
    image: ghcr.io/antondrpq/wildberries-api-mcp-server:latest
    container_name: wb-api-mcp
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      NODE_ENV: production
    command: ["node", "start.js"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - ./logs:/usr/src/app/logs
