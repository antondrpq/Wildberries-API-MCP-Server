version: '3.8'

services:
  wb-api-mcp:
    build: .
    container_name: wb-api-mcp
    ports:
      - "${PORT:-3000}:3000"
      - "${MCP_PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      - PORT=3000
      - MCP_PORT=3001
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - ./logs:/usr/src/app/logs
